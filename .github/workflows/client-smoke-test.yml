name: Client startup and settings screen test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  client-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Install headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Launch Minecraft and verify settings screen initialization
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dlowspec.rendercore.testConfigScreen=true"
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" bash -c '
            set -euo pipefail
            setsid gradle runClient --no-daemon > client-smoke.log 2>&1 &
            gradle_pid=$!
            cleanup() {
              kill -TERM -- "-$gradle_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$gradle_pid" 2>/dev/null || true
              wait "$gradle_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            ready=0
            for i in $(seq 1 90); do
              if grep -q "RENDERCORE_CONFIG_SCREEN_TEST_READY" client-smoke.log \
                && grep -q "Aether initialized:" client-smoke.log; then
                ready=1
                break
              fi
              if ! kill -0 "$gradle_pid" 2>/dev/null; then
                cat client-smoke.log
                echo "Minecraft exited before startup and settings-screen initialization completed."
                exit 1
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              cat client-smoke.log
              echo "Timed out waiting for Aether startup and settings-screen initialization."
              exit 1
            fi

            echo "Minecraft startup, Aether initialization, and settings-screen initialization passed."
          '
      - name: Upload client startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RenderCore-client-startup-log
          path: client-smoke.log
          if-no-files-found: warn
