name: Client startup and settings screen test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  client-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Install visual test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils openbox tesseract-ocr imagemagick libflite1 libgl1-mesa-dri libglx-mesa0
      - name: Launch Minecraft and capture the settings screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/screenshots
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dlowspec.rendercore.testConfigScreen=true"
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" bash -c '
            set -euo pipefail
            openbox >/tmp/rendercore-openbox.log 2>&1 &
            # Keep Gradle and its Minecraft child in one process group so the
            # test can shut down the whole client cleanly after the capture.
            setsid gradle runClient --no-daemon > client-smoke.log 2>&1 &
            gradle_pid=$!
            cleanup() {
              kill -TERM -- "-$gradle_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$gradle_pid" 2>/dev/null || true
              wait "$gradle_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            ready=0
            for i in $(seq 1 90); do
              if grep -q "RENDERCORE_CONFIG_SCREEN_TEST_READY" client-smoke.log; then
                ready=1
                break
              fi
              if ! kill -0 "$gradle_pid" 2>/dev/null; then
                cat client-smoke.log
                echo "Minecraft exited before opening the settings screen."
                exit 1
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              cat client-smoke.log
              echo "Timed out waiting for the settings screen to open."
              exit 1
            fi

            # CLIENT_STARTED can fire before the first completed render. Keep
            # sampling the virtual display until OCR confirms that the actual
            # settings screen has appeared, instead of accepting a black frame.
            visible=0
            for i in $(seq 1 60); do
              window_id=$(xdotool search --onlyvisible --name "Minecraft" 2>/dev/null | head -n 1 || true)
              if [ -n "$window_id" ]; then
                import -window "$window_id" run/screenshots/settings-screen.png
              else
                import -window root run/screenshots/settings-screen.png
              fi
              tesseract run/screenshots/settings-screen.png stdout 2>/dev/null > settings-screen-ocr.txt || true
              if grep -Eiq "Entity distance culling" settings-screen-ocr.txt \
                && grep -Eiq "Players distance" settings-screen-ocr.txt \
                && grep -Eiq "Hostile mob distance" settings-screen-ocr.txt \
                && grep -Eiq "Diagnostics" settings-screen-ocr.txt; then
                visible=1
                break
              fi
              if ! kill -0 "$gradle_pid" 2>/dev/null; then
                cat client-smoke.log
                echo "Minecraft exited before the settings screen was rendered."
                exit 1
              fi
              sleep 1
            done
            if [ "$visible" -ne 1 ]; then
              cat settings-screen-ocr.txt || true
              xwininfo -root -tree || true
              xdotool search --onlyvisible --name "." 2>/dev/null | while read -r id; do xwininfo -id "$id" || true; done
              cat /tmp/rendercore-openbox.log || true
              cat client-smoke.log
              echo "The settings screen never became visible in the Xvfb capture."
              exit 1
            fi
            echo "Settings screen visual text test passed."
          '
      - name: Upload settings screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RenderCore-settings-screen-test
          path: |
            run/screenshots/*.png
            settings-screen-ocr.txt
            client-smoke.log
          if-no-files-found: warn
