name: Client startup smoke test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  client-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Install software display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Launch Minecraft client and verify mixin startup
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 120s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 gradle runClient --no-daemon > client-smoke.log 2>&1
          status=$?
          set -e
          cat client-smoke.log
          if grep -Eiq 'Mixin apply failed|InvalidInjectionException|MixinTransformerError|Critical injection failure|Error loading class|Could not execute entrypoint' client-smoke.log; then
            echo "Minecraft client reported a mixin or entrypoint startup failure."
            exit 1
          fi
          if ! grep -q 'Loading Minecraft 1.21.11 with Fabric Loader' client-smoke.log; then
            echo "Minecraft did not reach Fabric Loader startup."
            exit 1
          fi
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && [ "$status" -ne 0 ]; then
            echo "Minecraft startup exited unexpectedly with status $status."
            exit 1
          fi
