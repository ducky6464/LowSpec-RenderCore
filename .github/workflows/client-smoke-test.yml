name: Client startup and settings screen test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  client-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Install visual test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool tesseract-ocr imagemagick libgl1-mesa-dri libglx-mesa0
      - name: Launch Minecraft and capture the settings screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/screenshots
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dlowspec.rendercore.testConfigScreen=true"
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            gradle runClient --no-daemon > client-smoke.log 2>&1 &
            gradle_pid=$!
            cleanup() {
              kill "$gradle_pid" 2>/dev/null || true
              wait "$gradle_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            ready=0
            for i in $(seq 1 90); do
              if grep -q "RENDERCORE_CONFIG_SCREEN_TEST_READY" client-smoke.log; then
                ready=1
                break
              fi
              if ! kill -0 "$gradle_pid" 2>/dev/null; then
                cat client-smoke.log
                echo "Minecraft exited before opening the settings screen."
                exit 1
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              cat client-smoke.log
              echo "Timed out waiting for the settings screen to open."
              exit 1
            fi

            # Some GLFW/Mesa combinations do not expose a window title that
            # xdotool can match reliably under bare Xvfb. The game has already
            # logged the settings-screen-ready marker, so capture the X root
            # window directly instead of depending on a fragile title lookup.
            sleep 3
            import -window root run/screenshots/settings-screen.png
            screenshot="run/screenshots/settings-screen.png"
            if [ ! -s "$screenshot" ]; then
              cat client-smoke.log
              echo "Xvfb did not produce a settings-screen capture."
              exit 1
            fi

            tesseract "$screenshot" stdout 2>/dev/null | tee settings-screen-ocr.txt
            grep -Eiq "Entity distance culling" settings-screen-ocr.txt
            grep -Eiq "Players distance" settings-screen-ocr.txt
            grep -Eiq "Hostile mob distance" settings-screen-ocr.txt
            grep -Eiq "Diagnostics" settings-screen-ocr.txt
            echo "Settings screen visual text test passed."
          '
      - name: Upload settings screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RenderCore-settings-screen-test
          path: |
            run/screenshots/*.png
            settings-screen-ocr.txt
            client-smoke.log
          if-no-files-found: warn
